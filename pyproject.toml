[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-muon"
dynamic = ["version"]
description = "Hybrid whole-matrix Muon and AdamW for dense Qwen-style language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.10"]
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "hybrid_muon.__version__"}
